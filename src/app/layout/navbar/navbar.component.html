<nav class="relative flex justify-between items-center px-5 my-5 z-50">
  <!-- Logo -->
  <a routerLink="" class="uppercase text-xl sm:text-2xl text-white shadow-white cursor-pointer hover:text-gray-300 transition-colors z-50">omar Atef</a>
  
  <!-- Desktop Navigation -->
  <ul class="hidden lg:flex p-2 py-3 rounded-full bg-white/10 backdrop-blur-md border border-white/20 text-white gap-2 w-fit text-sm lg:text-md">
    <li>
      <a
        routerLink=""
        routerLinkActive="bg-white text-black"
        [routerLinkActiveOptions]="{exact: true}"
        class="px-4 py-2 rounded-full hover:bg-white/20 transition-all duration-300"
      >Home</a>
    </li>
    <li>
      <a
        routerLink="projects"
        routerLinkActive="bg-white text-black"
        class="px-4 py-2 rounded-full hover:bg-white/20 transition-all duration-300"
      >Projects</a>
    </li>
    <li>
      <a
        routerLink="services"
        routerLinkActive="bg-white text-black"
        class="px-4 py-2 rounded-full hover:bg-white/20 transition-all duration-300"
      >Services</a>
    </li>
  </ul>

  <!-- Desktop Contact Button -->
  <a href="#contact"
    class="hidden lg:block px-4 py-2 rounded-full border border-white bg-black text-white hover:bg-white hover:text-black hover:border-white transition-all duration-300 z-10">Contact
    <i class="ms-2 bi bi-send-fill"></i>
  </a>

  <!-- Mobile Menu Button -->
  <button 
    (click)="toggleMenu()"
    class="lg:hidden z-50 p-2 rounded-full bg-white/10 backdrop-blur-md border border-white/20 text-white hover:bg-white/20 transition-all duration-300"
    [attr.aria-label]="isMenuOpen ? 'Close menu' : 'Open menu'">
    <i [class]="isMenuOpen ? 'bi bi-x-lg text-2xl' : 'bi bi-list text-2xl'"></i>
  </button>

  <!-- Mobile Menu -->
  <div 
    *ngIf="isMenuOpen"
    class="fixed inset-0 bg-black/95 backdrop-blur-lg z-40 lg:hidden flex flex-col items-center justify-center">
    <ul class="flex flex-col gap-6 text-center text-white text-2xl">
      <li>
        <a
          routerLink=""
          routerLinkActive="text-blue-400"
          [routerLinkActiveOptions]="{exact: true}"
          (click)="closeMenu()"
          class="hover:text-blue-400 transition-all duration-300"
        >Home</a>
      </li>
      <li>
        <a
          routerLink="projects"
          routerLinkActive="text-blue-400"
          (click)="closeMenu()"
          class="hover:text-blue-400 transition-all duration-300"
        >Projects</a>
      </li>
      <li>
        <a
          routerLink="services"
          routerLinkActive="text-blue-400"
          (click)="closeMenu()"
          class="hover:text-blue-400 transition-all duration-300"
        >Services</a>
      </li>
      <li>
        <a
          href="#contact"
          (click)="closeMenu()"
          class="px-6 py-3 rounded-full border-2 border-white bg-white text-black hover:bg-black hover:text-white transition-all duration-300 inline-block mt-4"
        >Contact <i class="ms-2 bi bi-send-fill"></i></a>
      </li>
    </ul>
  </div>
</nav>
